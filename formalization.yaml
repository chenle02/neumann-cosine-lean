version: v0.4
project:
  name: neumann-cosine-lean
  description: Lean 4 / Mathlib library on Neumann cosine series on an interval [0,L] and the discrete
    Neumann Laplacian -- orthogonality and product integrals of cosine modes, summable cosine coefficients
    and pointwise expansions under W^{2,1} or H^2 Neumann data, a divergence-form projection identity,
    the eigenvalues of the discrete Neumann Laplacian and convergence of its modal minimum. Classical
    analysis; no new mathematics is claimed.
  authors:
  - Le Chen
  license: Apache-2.0
sources:
- title: 'Chemotaxis models with signal-dependent sensitivity and a logistic-type source, III: Bifurcation
    and spike-like solutions'
  authors:
  - Le Chen
  - Ian Ruau
  - Wenxian Shen
  id: arXiv:2610.20976
  type: article
  relationship: background
  note: The library was first developed for the Lean companion of this paper and keeps only the general
    mathematics; nothing in it depends on the paper. It does not formalize the paper's theorems.
related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: builds-on
  note: pinned in lake-manifest.json
status:
  scope: 'Formalized: the cosine-mode integrals, coefficient summability and pointwise Neumann cosine
    expansions on [0,L] (L>0) under W^{2,1} or H^2 Neumann data, the H^2 Neumann weak-derivative interface,
    the divergence-form projection bound, and the discrete Neumann Laplacian spectrum with its modal-minimum
    tail and limit. Excluded: PDE theory (existence, uniqueness, regularity, semigroups), L^2 completeness
    of the cosine system and Parseval for general L^2 functions, a general bridge to Mathlib fourierCoeff
    (planned for v0.2), and domains in two or more dimensions.'
  sorry_count: 0
  axioms:
  - Classical.choice
  - Quot.sound
  - propext
  evidence:
    commit: d16a23572ff3212856109dda2010668ed7adbf73
    gate_receipt: .lean-receipts/d16a23572ff3-slurm-5587231.json
    comparator_receipt: .lean-receipts/d16a23572ff3-comparator.json
