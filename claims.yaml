# Claims of neumann-cosine-lean (schema claims/1): every public declaration of the library.
# status: reusable = judged by a comparator configuration (comparator.json, comparator.headline.json);
# experimental = proved in the library and axiom-checked, but not stated in a Challenge.
schema: claims/1
package: neumann-cosine-lean
claims:
- id: neumann-cosine-lean/coefficients-neumann-w21
  decl: NeumannCosine.Coefficients.NeumannW21
  kind: definition
  summary: 'The class of w ∈ W^{2,1}(0,L) with Neumann data: w absolutely continuous on [0,L] with derivative w''
    on (0,L), w'' absolutely continuous, and w''(0) = w''(L) = 0.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-neumann-w21-of-cont-diff
  decl: NeumannCosine.Coefficients.NeumannW21.of_contDiff
  kind: theorem
  summary: A `C²` function with `w'(0) = w'(L) = 0` lies in the Neumann class (with `w' = deriv w`).
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-abs-cosine-coeff-le
  decl: NeumannCosine.Coefficients.abs_cosineCoeff_le
  kind: theorem
  summary: '`|w_k| ≤ (2L/π²) (∫₀ᴸ |w''''|) / k²` for `k ≥ 1`.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: reusable
- id: neumann-cosine-lean/coefficients-cos-cos-cos-cos-of-neumann
  decl: NeumannCosine.Coefficients.cos_cos_cos_cos_of_neumann
  kind: theorem
  summary: '`ProductIdentities.cos_cos_cos_cos` (`k ≥ 0`) for `u, v, w` in the Neumann class, with their cosine
    coefficients.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cos-cos-cos-of-neumann
  decl: NeumannCosine.Coefficients.cos_cos_cos_of_neumann
  kind: theorem
  summary: '`ProductIdentities.cos_cos_cos` (`k ≥ 0`) for `u, v` in the Neumann class, with their cosine coefficients.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cosine-coeff
  decl: NeumannCosine.Coefficients.cosineCoeff
  kind: definition
  summary: 'The Neumann cosine coefficients: `w_0 = (1/L) ∫₀ᴸ w`, `w_k = (2/L) ∫₀ᴸ w(x) cos(k π x / L) dx` for `k
    ≥ 1`.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cosine-coeff-eq-half-coeff
  decl: NeumannCosine.Coefficients.cosineCoeff_eq_halfCoeff
  kind: theorem
  summary: '`w_0 = ŵ_0` and `w_k = 2 ŵ_k` for `k ≥ 1`.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cosine-coeff-eq-neg-mul-second-deriv
  decl: NeumannCosine.Coefficients.cosineCoeff_eq_neg_mul_secondDeriv
  kind: theorem
  summary: For `k ≥ 1` the cosine coefficient of `w` is `-(L/(kπ))²` times the corresponding coefficient of `w''`.
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: reusable
- id: neumann-cosine-lean/coefficients-cosine-coeff-of-ne-zero
  decl: NeumannCosine.Coefficients.cosineCoeff_of_ne_zero
  kind: theorem
  summary: For `k ≥ 1`, `w_k = (2/L) ∫₀ᴸ w(x) cos(k π x / L) dx`.
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cosine-coeff-zero
  decl: NeumannCosine.Coefficients.cosineCoeff_zero
  kind: theorem
  summary: 'The zero mode is the mean: `w_0 = (1/L) ∫₀ᴸ w`.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-cosine-sine-sine-of-neumann
  decl: NeumannCosine.Coefficients.cosine_sine_sine_of_neumann
  kind: theorem
  summary: '`ProductIdentities.cosine_sine_sine` for `u` in the Neumann class, with its cosine coefficients `u_i`.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-even-ext
  decl: NeumannCosine.Coefficients.evenExt
  kind: definition
