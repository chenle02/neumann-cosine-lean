  decl: NeumannCosine.Sobolev.H2Neumann.H2
  kind: definition
  summary: '`w ∈ H²(0,L)` with weak derivatives `w₁ = w_x`, `w₂ = w_{xx}`: `w, w₁, w₂ ∈ L²(0,L)`, `∫₀ᴸ w φ'' = -∫₀ᴸ
    w₁ φ` and `∫₀ᴸ w₁ φ'' = -∫₀ᴸ w₂ φ` for every `φ ∈ C_c^∞(0,L)`.'
  keywords: [sobolev, h2, neumann, cosine-coefficients]
  file: NeumannCosine/Sobolev/H2Neumann.lean
  status: experimental
- id: neumann-cosine-lean/sobolev-h2-neumann-h2-exists-neumann-w21
  decl: NeumannCosine.Sobolev.H2Neumann.H2.exists_neumannW21
  kind: theorem
  summary: '`H²` with Neumann data lies in the Neumann class. If `w ∈ H²(0,L)` (weak derivatives `w₁, w₂`) satisfies
    the Neumann trace condition `w_x(0) = w_x(L) = 0`, then `w` has a representative `W` with `NeumannW21 L W W''`,
    where `W = w` and `W'' = w₁` a.e. on `(0,L)`.'
  keywords: [sobolev, h2, neumann, cosine-coefficients]
  file: NeumannCosine/Sobolev/H2Neumann.lean
  status: experimental
- id: neumann-cosine-lean/sobolev-h2-neumann-h2-has-sum-cosine-coeff
  decl: NeumannCosine.Sobolev.H2Neumann.H2.hasSum_cosineCoeff
  kind: theorem
  summary: Cosine expansion. For `w ∈ H²(0,L)` with Neumann data there is a representative `W`, continuous on `[0,L]`
    and equal to `w` a.e. on `(0,L)`, with `W(x) = ∑_{n ≥ 0} w_n cos(n π x / L)` for every `x ∈ [0,L]`, where `w_n`
    are the cosine coefficients of `w`.
  keywords: [sobolev, h2, neumann, cosine-coefficients]
  file: NeumannCosine/Sobolev/H2Neumann.lean
  status: reusable
- id: neumann-cosine-lean/sobolev-h2-neumann-h2-has-weak-deriv
