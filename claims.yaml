  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-even-periodic
  decl: NeumannCosine.Coefficients.evenPeriodic
  kind: definition
  summary: The even `2L`-periodic extension of `w`, as a continuous function on the circle `ℝ / 2Lℤ`.
