  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-has-sum-cosine-coeff
  decl: NeumannCosine.Coefficients.hasSum_cosineCoeff
  kind: theorem
  summary: Cosine expansion. For `w` in the Neumann class and `x ∈ [0, L]`, `w(x) = ∑_{k ≥ 0} w_k cos(k π x / L)`,
    and the series converges absolutely.
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: reusable
- id: neumann-cosine-lean/coefficients-integral-mul-cos-eq
  decl: NeumannCosine.Coefficients.integral_mul_cos_eq
  kind: theorem
  summary: 'Two integrations by parts against `cos (ω x)` with `sin (ω L) = 0`: `∫₀ᴸ w cos(ωx) = -(1/ω²) ∫₀ᴸ w''''
    cos(ωx)`, using the Neumann data.'
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-summable-half-coeff
  decl: NeumannCosine.Coefficients.summable_halfCoeff
  kind: theorem
  summary: The half-normalized coefficients are summable over `ℤ`.
