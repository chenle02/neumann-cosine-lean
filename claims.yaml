- id: neumann-cosine-lean/kernel-integrals-integral-cos-cos-cos
  decl: NeumannCosine.KernelIntegrals.integral_cos_cos_cos
  kind: theorem
  summary: 'The three-cosine kernel: for all `k ≥ 0`, the coefficient of `u_i v_j` is `(L/4)(1_{i-j=k} + 1_{i-j=-k}
    + 1_{i+j=k}) + (L/4) 1_{k=0} 1_{i=0} 1_{j=0}`.'
  keywords: [cosine, trigonometric-integral, product-to-sum]
  file: NeumannCosine/KernelIntegrals.lean
  status: reusable
