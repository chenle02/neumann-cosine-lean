  kind: theorem
  summary: 'The four-cosine kernel: for all `k ≥ 0`, the coefficient of `u_i v_j w_l` is `(L/8)` times seven signed
    indicators plus `(L/8) 1_{k=0} 1_{i=j=l=0}`.'
  keywords: [cosine, trigonometric-integral, product-to-sum]
  file: NeumannCosine/KernelIntegrals.lean
  status: reusable
- id: neumann-cosine-lean/kernel-integrals-integral-cos-cos-cos-cos-signed
