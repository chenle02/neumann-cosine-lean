- id: neumann-cosine-lean/divergence-form-projection-abs-integral-add-mul-cos-le-of-ibp
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_add_mul_cos_le_of_ibp
  kind: theorem
  summary: 'The estimate shared by the two integration-by-parts forms: once `∫₀ᴸ dR₁ cos = ω ∫₀ᴸ R₁ sin`, the projection
    is at most `(L + kπ) B`.'
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: experimental
- id: neumann-cosine-lean/divergence-form-projection-abs-integral-le-of-abs-le
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_le_of_abs_le
  kind: theorem
  summary: '`|∫₀ᴸ f| ≤ L B` when `|f| ≤ B` on `[0, L]`.'
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: experimental
- id: neumann-cosine-lean/divergence-form-projection-abs-integral-source-add-deriv-mul-cos-le
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_source_add_deriv_mul_cos_le
  kind: theorem
  summary: 'Projection bound (differentiable `R₁`). For `L > 0` and `k : ℕ`, let `R₁` be continuous on `[0, L]`
    with derivative `dR₁` on `(0, L)`, `dR₁` interval integrable, `R₁ 0 = R₁ L = 0`, and let `R₀` be interval integrable,
    with `|R₀|, |R₁| ≤ B` on `[0, L]`.'
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: reusable
- id: neumann-cosine-lean/divergence-form-projection-abs-integral-source-add-deriv-mul-cos-le-deriv
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_source_add_deriv_mul_cos_le_deriv
  kind: theorem
  summary: Projection bound (`deriv` form). As `abs_integral_source_add_deriv_mul_cos_le`, with `R₁` differentiable
    on `(0, L)` and its derivative written `deriv R₁`.
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: experimental
- id: neumann-cosine-lean/divergence-form-projection-abs-integral-source-add-deriv-mul-cos-le-example
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_source_add_deriv_mul_cos_le_example
  kind: theorem
  summary: 'Example: the hypotheses of `abs_integral_source_add_deriv_mul_cos_le` hold for `R₀ = 1`, `R₁ x = sin(πx/L)`
    (vanishing at `0` and `L`) with `B = 1`, so the bound is not vacuous.'
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: experimental
- id: neumann-cosine-lean/divergence-form-projection-abs-integral-source-add-deriv-mul-cos-le-of-absolutely-continuous
  decl: NeumannCosine.DivergenceFormProjection.abs_integral_source_add_deriv_mul_cos_le_of_absolutelyContinuous
  kind: theorem
  summary: Projection bound (absolutely continuous `R₁`). As `abs_integral_source_add_deriv_mul_cos_le`, with `R₁`
    absolutely continuous on `[0, L]` and its derivative `deriv R₁`, which exists almost everywhere and is integrable
    (Mathlib's `AbsolutelyContinuousOnInterval`).
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: reusable
- id: neumann-cosine-lean/divergence-form-projection-integral-deriv-mul-cos
  decl: NeumannCosine.DivergenceFormProjection.integral_deriv_mul_cos
  kind: theorem
  summary: 'Integration by parts against the cosine mode, with vanishing boundary values: `∫₀ᴸ dR₁ cos(ωx) dx =
    ω ∫₀ᴸ R₁ sin(ωx) dx`, `ω = kπ/L`.'
  keywords: [cosine-projection, integration-by-parts, neumann]
  file: NeumannCosine/DivergenceFormProjection.lean
  status: experimental
