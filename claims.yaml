  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-summable-norm-cosine-coeff
  decl: NeumannCosine.Coefficients.summable_norm_cosineCoeff
  kind: theorem
  summary: 'The Neumann cosine coefficients of `w` are absolutely summable: `{w_k} ∈ ℓ¹(ℕ₀)`.'
