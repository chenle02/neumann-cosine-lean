- id: neumann-cosine-lean/normalized-integral-mode-three-mul
  decl: NeumannCosine.normalized_integral_mode_three_mul
  kind: theorem
  summary: 'For `n ≥ 1`, the third harmonic is orthogonal to mode `n`: `(2/L) ∫₀ᴸ cos_{3n} cos_n = 0`.'
