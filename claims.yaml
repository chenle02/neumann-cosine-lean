  status: experimental
- id: neumann-cosine-lean/coefficients-fourier-coeff-even-periodic
  decl: NeumannCosine.Coefficients.fourierCoeff_evenPeriodic
  kind: theorem
  summary: The `n`-th Fourier coefficient on `ℝ / 2Lℤ` of the even extension is `(1/L) ∫₀ᴸ w(x) cos(n π x / L) dx`.
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-half-coeff
  decl: NeumannCosine.Coefficients.halfCoeff
  kind: definition
  summary: The half-normalized coefficient `(1/L) ∫₀ᴸ w(x) cos(n π x / L) dx`, `n ∈ ℤ`; it is the `n`-th complex
    Fourier coefficient of the even `2L`-periodic extension of `w`.
  keywords: [cosine-coefficients, neumann, sobolev, fourier-series]
  file: NeumannCosine/Coefficients.lean
  status: experimental
- id: neumann-cosine-lean/coefficients-half-coeff-neg
  decl: NeumannCosine.Coefficients.halfCoeff_neg
  kind: theorem
