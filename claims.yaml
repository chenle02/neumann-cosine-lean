- id: neumann-cosine-lean/normalized-integral-mode-mul-self
  decl: NeumannCosine.normalized_integral_mode_mul_self
  kind: theorem
  summary: For `n ≥ 1`, `(2/L) ∫₀ᴸ cos_n cos_n = 1`.
  keywords: [neumann, cosine, orthogonality]
  file: NeumannCosine/Basic.lean
